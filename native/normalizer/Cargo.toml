[package]
name = "qp-normalizer"
version = "0.1.0"
edition = "2024"
publish = false
description = "C ABI around normalizer-tr, for the Quick Prompt engine (Turkish read aloud: numbers, dates, symbols spoken)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
normalizer-tr = "=0.8.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
