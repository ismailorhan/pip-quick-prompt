name: Build

# Minutes budget (private repo): Linux = 1x, Windows = 2x, macOS = 10x.
# - Every push / PR: Linux tests only (cheap).
# - Push to main that touches code, a v* tag, or a manual run: macOS package (the .lplug4 to install).
# - Windows build: only on tags and manual runs.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the build still running for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/QuickPrompt.Tests -c Release

  windows:
    name: Build (Windows)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build QuickPrompt.slnx -c Release -p:SkipPluginLink=true
      - run: dotnet test tests/QuickPrompt.Tests -c Release --no-build

  package:
    name: Package (macOS popup + plugin)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and pack
        env:
          QP_VERSION: 0.3.${{ github.run_number }}
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: QuickPrompt
          path: dist/QuickPrompt.lplug4
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: QuickPrompt
          path: dist
      - name: Rolling "latest" pre-release (every push to main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push -f origin HEAD:refs/tags/latest
          notes="Version 0.3.${{ github.run_number }} — automatic build of $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --prerelease --title "Latest build" --notes "$notes"
          else
            gh release create latest --prerelease --title "Latest build" --notes "$notes"
          fi
          gh release upload latest dist/QuickPrompt.lplug4 --clobber
      - name: Versioned release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/QuickPrompt.lplug4 --title "Quick Prompt $GITHUB_REF_NAME" --generate-notes
